scenarios:
  - slug: "supermarket-shopping"
    category: "DAILY_LIFE"
    title_vi: "Mua sắm tại siêu thị"
    title_en: "Supermarket Shopping"
    level: "A2"
    estimated_duration_minutes: 10
    context: "Bạn đang đi mua sắm tại một siêu thị quốc tế. Bạn cần tìm các nguyên liệu tươi sống, hỏi giá một số mặt hàng và tiến hành thanh toán tại quầy thu ngân."
    user_role: "Khách mua hàng"
    ai_role: "Nhân viên hỗ trợ & Thu ngân siêu thị"
    goals:
      - "Hỏi thăm và xác định vị trí mặt hàng cần mua"
      - "Hỏi giá và kiểm tra khuyến mãi"
      - "Hỏi phương thức thanh toán và hoàn tất mua sắm"
    sort_order: 1
    requirements:
      - description: "Chào hỏi và hỏi vị trí quầy hàng rau củ hoặc thực phẩm tươi"
        type: "TASK"
        expected_chunk_function: "OPENING"
        is_mandatory: true
        sort_order: 1
      - description: "Hỏi giá hoặc thông tin của một sản phẩm"
        type: "TASK"
        expected_chunk_function: "REQUEST"
        is_mandatory: true
        sort_order: 2
      - description: "Hỏi làm rõ phương thức thanh toán hoặc thẻ tín dụng"
        type: "TASK"
        expected_chunk_function: "CLARIFY"
        is_mandatory: true
        sort_order: 3
      - description: "Cảm ơn nhân viên và nói lời chào kết thúc"
        type: "TASK"
        expected_chunk_function: "CLOSING"
        is_mandatory: false
        sort_order: 4
    chunks:
      - function_tag: "OPENING"
        text: "Excuse me, where can I find...?"
        meaning_vi: "Xin lỗi, tôi có thể tìm... ở đâu?"
        example_sentence: "Excuse me, where can I find the organic vegetable section?"
        accepted_variations:
          - "Could you tell me where... is?"
          - "Excuse me, which aisle has...?"
          - "Where is the produce section, please?"
        sort_order: 1
      - function_tag: "REQUEST"
        text: "How much is this...?"
        meaning_vi: "Cái này giá bao nhiêu?"
        example_sentence: "How much is this bottle of olive oil?"
        accepted_variations:
          - "What's the price of this?"
          - "Could you tell me how much this costs?"
          - "How much does this cost?"
        sort_order: 2
      - function_tag: "CLARIFY"
        text: "Do you accept credit cards?"
        meaning_vi: "Ở đây có chấp nhận thẻ tín dụng không?"
        example_sentence: "Do you accept credit cards or mobile payments?"
        accepted_variations:
          - "Can I pay by card?"
          - "Is card payment accepted here?"
          - "Do you take contactless payment?"
        sort_order: 3
      - function_tag: "AGREE_DECLINE"
        text: "That sounds good, I'll take it."
        meaning_vi: "Nghe được đấy, tôi sẽ lấy món này."
        example_sentence: "That sounds good, I'll take two cartons of milk."
        accepted_variations:
          - "Great, I'll take this one."
          - "That works for me, I'll buy it."
          - "Sounds good, please give me one."
        sort_order: 4
      - function_tag: "CLOSING"
        text: "Thank you for your help!"
        meaning_vi: "Cảm ơn bạn rất nhiều vì đã giúp đỡ!"
        example_sentence: "Thank you for your help! Have a nice day."
        accepted_variations:
          - "Thanks a lot for your help!"
          - "Thank you so much!"
          - "Thanks for helping me out."
        sort_order: 5

  - slug: "restaurant-reservation"
    category: "DAILY_LIFE"
    title_vi: "Đặt bàn tại nhà hàng"
    title_en: "Restaurant Table Reservation"
    level: "A2"
    estimated_duration_minutes: 12
    context: "Bạn gọi điện thoại tới nhà hàng The Garden để đặt bàn ăn tối cho gia đình vào tối nay, kèm theo một số yêu cầu đặc biệt về chỗ ngồi."
    user_role: "Khách đặt bàn"
    ai_role: "Nhân viên tiếp tân nhà hàng"
    goals:
      - "Nêu rõ số người và thời gian muốn đặt bàn"
      - "Yêu cầu vị trí ngồi cụ thể (gần cửa sổ hoặc khu vực yên tĩnh)"
      - "Xác nhận lại thông tin đặt bàn"
    sort_order: 2
    requirements:
      - description: "Nêu yêu cầu đặt bàn cho số người và thời gian mong muốn"
        type: "TASK"
        expected_chunk_function: "REQUEST"
        is_mandatory: true
        sort_order: 1
      - description: "Đề xuất hoặc làm rõ yêu cầu vị trí bàn ăn"
        type: "TASK"
        expected_chunk_function: "CLARIFY"
        is_mandatory: true
        sort_order: 2
      - description: "Xác nhận và đồng ý với đề xuất của tiếp tân"
        type: "TASK"
        expected_chunk_function: "AGREE_DECLINE"
        is_mandatory: true
        sort_order: 3
      - description: "Chào tạm biệt và cảm ơn khi hoàn tất cuộc gọi"
        type: "TASK"
        expected_chunk_function: "CLOSING"
        is_mandatory: false
        sort_order: 4
    chunks:
      - function_tag: "OPENING"
        text: "I'd like to book a table for..."
        meaning_vi: "Tôi muốn đặt một bàn cho..."
        example_sentence: "I'd like to book a table for four people tonight at seven."
        accepted_variations:
          - "Could I reserve a table for...?"
          - "I want to make a reservation for..."
          - "Can I book a table for...?"
        sort_order: 1
      - function_tag: "REQUEST"
        text: "Could we have a table near...?"
        meaning_vi: "Chúng tôi có thể ngồi bàn gần... được không?"
        example_sentence: "Could we have a table near the window, please?"
        accepted_variations:
          - "Is it possible to sit near the window?"
          - "We would prefer a table near the window."
          - "Can we get a table by the window?"
        sort_order: 2
      - function_tag: "CLARIFY"
        text: "Could you confirm if...?"
        meaning_vi: "Bạn có thể xác nhận liệu... được không?"
        example_sentence: "Could you confirm if outdoor seating is available?"
        accepted_variations:
          - "Can you confirm that for me?"
          - "Just to make sure, is that confirmed?"
        sort_order: 3
      - function_tag: "AGREE_DECLINE"
        text: "That time works perfectly for us."
        meaning_vi: "Khung giờ đó hoàn toàn phù hợp với chúng tôi."
        example_sentence: "7:30 PM works perfectly for us, thank you."
        accepted_variations:
          - "That works great for me."
          - "That time is fine."
          - "That sounds perfect."
        sort_order: 4
      - function_tag: "CLOSING"
        text: "See you tonight, thank you!"
        meaning_vi: "Hẹn gặp vào tối nay, cảm ơn bạn!"
        example_sentence: "See you tonight at seven, thank you very much!"
        accepted_variations:
          - "Thanks, see you later tonight!"
          - "Thank you, see you then!"
        sort_order: 5

  - slug: "doctor-visit"
    category: "DAILY_LIFE"
    title_vi: "Đến gặp bác sĩ"
    title_en: "Doctor's Appointment"
    level: "B1"
    estimated_duration_minutes: 15
    context: "Bạn cảm thấy không khỏe trong 2 ngày qua với triệu chứng sốt nhẹ và đau họng. Bạn đến phòng khám đa khoa để bác sĩ kiểm tra và kê đơn thuốc."
    user_role: "Bệnh nhân"
    ai_role: "Bác sĩ khám bệnh"
    goals:
      - "Mô tả rõ các triệu chứng và thời gian bắt đầu bị"
      - "Hỏi về cách dùng thuốc và lưu ý kiêng cữ"
      - "Hỏi làm rõ thời gian tái khám nếu chưa đỡ"
    sort_order: 3
    requirements:
      - description: "Chào hỏi và mô tả triệu chứng bệnh chính"
        type: "TASK"
        expected_chunk_function: "OPENING"
        is_mandatory: true
        sort_order: 1
      - description: "Mô tả chi tiết tần suất hoặc mức độ đau"
        type: "TASK"
        expected_chunk_function: "REQUEST"
        is_mandatory: true
        sort_order: 2
      - description: "Hỏi làm rõ liều lượng hoặc tác dụng phụ của thuốc"
        type: "TASK"
        expected_chunk_function: "CLARIFY"
        is_mandatory: true
        sort_order: 3
      - description: "Đồng ý tuân theo chỉ dẫn điều trị của bác sĩ"
        type: "TASK"
        expected_chunk_function: "AGREE_DECLINE"
        is_mandatory: false
        sort_order: 4
      - description: "Cảm ơn bác sĩ trước khi rời phòng khám"
        type: "TASK"
        expected_chunk_function: "CLOSING"
        is_mandatory: false
        sort_order: 5
    chunks:
      - function_tag: "OPENING"
        text: "I haven't been feeling well since..."
        meaning_vi: "Tôi cảm thấy không được khỏe từ..."
        example_sentence: "I haven't been feeling well since yesterday morning."
        accepted_variations:
          - "I've been feeling sick since..."
          - "I started feeling unwell two days ago."
          - "I'm not feeling well."
        sort_order: 1
      - function_tag: "REQUEST"
        text: "I have a sore throat and..."
        meaning_vi: "Tôi bị đau họng và..."
        example_sentence: "I have a sore throat and a slight fever."
        accepted_variations:
          - "My throat hurts and I have a fever."
          - "I suffer from a sore throat and headache."
        sort_order: 2
      - function_tag: "CLARIFY"
        text: "How often should I take this medication?"
        meaning_vi: "Tôi nên uống loại thuốc này bao lâu một lần?"
        example_sentence: "How often should I take this medication, and should I take it with food?"
        accepted_variations:
          - "How many times a day should I take this?"
          - "Should I take this medicine before or after meals?"
          - "What is the dosage for this medicine?"
        sort_order: 3
      - function_tag: "AGREE_DECLINE"
        text: "I understand, I'll follow your instructions."
        meaning_vi: "Tôi hiểu rồi, tôi sẽ làm theo chỉ dẫn của bác sĩ."
        example_sentence: "I understand, I'll get plenty of rest and drink lots of water."
        accepted_variations:
          - "Got it, I will follow your advice."
          - "I will make sure to do that."
        sort_order: 4
      - function_tag: "CLOSING"
        text: "Thank you so much, Doctor."
        meaning_vi: "Cảm ơn bác sĩ rất nhiều."
        example_sentence: "Thank you so much, Doctor. I really appreciate your help."
        accepted_variations:
          - "Thanks a lot for your care, Doctor."
          - "Thank you, have a good day Doctor."
        sort_order: 5

  - slug: "renting-apartment"
    category: "DAILY_LIFE"
    title_vi: "Thuê căn hộ"
    title_en: "Renting an Apartment"
    level: "B1"
    estimated_duration_minutes: 15
    context: "Bạn đang tìm thuê một căn hộ 1 phòng ngủ tại trung tâm thành phố. Bạn gặp chủ nhà hoặc nhân viên môi giới để xem nhà, hỏi về giá thuê, tiền cọc và tiện ích đi kèm."
    user_role: "Người đi thuê nhà"
    ai_role: "Chủ nhà / Môi giới bất động sản"
    goals:
      - "Hỏi giá thuê hàng tháng và tiền đặt cọc"
      - "Hỏi về các chi phí tiện ích (điện, nước, internet)"
      - "Đàm phán ngày chuyển vào và ký hợp đồng"
    sort_order: 4
    requirements:
      - description: "Mở đầu cuộc nói chuyện và hỏi tình trạng căn hộ"
        type: "TASK"
        expected_chunk_function: "OPENING"
        is_mandatory: true
        sort_order: 1
      - description: "Hỏi giá thuê và các chi phí tiện ích đi kèm"
        type: "TASK"
        expected_chunk_function: "REQUEST"
        is_mandatory: true
        sort_order: 2
      - description: "Hỏi làm rõ các điều khoản trong hợp đồng thuê nhà"
        type: "TASK"
        expected_chunk_function: "CLARIFY"
        is_mandatory: true
        sort_order: 3
      - description: "Đồng ý hoặc đề xuất thỏa thuận về ngày dọn vào"
        type: "TASK"
        expected_chunk_function: "AGREE_DECLINE"
        is_mandatory: false
        sort_order: 4
      - description: "Cảm ơn và hẹn ngày ký hợp đồng"
        type: "TASK"
        expected_chunk_function: "CLOSING"
        is_mandatory: false
        sort_order: 5
    chunks:
      - function_tag: "OPENING"
        text: "I'm calling about the apartment for rent on..."
        meaning_vi: "Tôi gọi điện hỏi về căn hộ cho thuê ở..."
        example_sentence: "I'm calling about the one-bedroom apartment for rent on Oak Street."
        accepted_variations:
          - "I'm interested in renting the apartment on..."
          - "I saw your listing for the apartment and wanted to ask..."
        sort_order: 1
      - function_tag: "REQUEST"
        text: "Does the monthly rent include utilities?"
        meaning_vi: "Giá thuê hàng tháng đã bao gồm chi phí điện nước chưa?"
        example_sentence: "Does the monthly rent include utilities like water and high-speed internet?"
        accepted_variations:
          - "Are utilities included in the rent?"
          - "What bills are included in the monthly rent?"
        sort_order: 2
      - function_tag: "CLARIFY"
        text: "What is the minimum lease term?"
        meaning_vi: "Thời hạn hợp đồng thuê tối thiểu là bao lâu?"
        example_sentence: "What is the minimum lease term, and how much is the security deposit?"
        accepted_variations:
          - "How long is the lease agreement?"
          - "Is there a minimum stay requirement?"
        sort_order: 3
      - function_tag: "AGREE_DECLINE"
        text: "That terms work fine for me."
        meaning_vi: "Các điều khoản đó phù hợp với tôi."
        example_sentence: "A one-year lease works fine for me, I'm ready to move in next month."
        accepted_variations:
          - "That sounds reasonable to me."
          - "I agree with those conditions."
        sort_order: 4
      - function_tag: "CLOSING"
        text: "I look forward to hearing from you soon."
        meaning_vi: "Tôi rất mong sớm nhận được phản hồi từ bạn."
        example_sentence: "Thank you for the tour, I look forward to hearing from you soon."
        accepted_variations:
          - "Thanks for your time, talk to you soon."
          - "I will send you my documents today. Thank you!"
        sort_order: 5

  - slug: "daily-coffee-order"
    category: "DAILY_LIFE"
    title_vi: "Gọi đồ uống tại quán cà phê"
    title_en: "Ordering at a Coffee Shop"
    level: "A1"
    estimated_duration_minutes: 8
    context: "Bạn ghé vào một quán cà phê địa phương vào buổi sáng. Bạn muốn gọi một ly cà phê theo sở thích và mang đi."
    user_role: "Khách mua cà phê"
    ai_role: "Nhân viên pha chế (Barista)"
    goals:
      - "Chào hỏi và gọi món đồ uống mong muốn"
      - "Tùy chỉnh độ ngọt, loại sữa hoặc kích cỡ ly"
      - "Xác nhận mang đi hoặc uống tại chỗ"
    sort_order: 5
    requirements:
      - description: "Chào hỏi và gọi đồ uống chính"
        type: "TASK"
        expected_chunk_function: "OPENING"
        is_mandatory: true
        sort_order: 1
      - description: "Nêu yêu cầu về kích cỡ hoặc loại sữa"
        type: "TASK"
        expected_chunk_function: "REQUEST"
        is_mandatory: true
        sort_order: 2
      - description: "Xác nhận mang đi (to-go / takeaway)"
        type: "TASK"
        expected_chunk_function: "CLARIFY"
        is_mandatory: true
        sort_order: 3
      - description: "Cảm ơn nhân viên phục vụ"
        type: "TASK"
        expected_chunk_function: "CLOSING"
        is_mandatory: false
        sort_order: 4
    chunks:
      - function_tag: "OPENING"
        text: "Hi, could I get a...?"
        meaning_vi: "Xin chào, cho tôi một ly... được không?"
        example_sentence: "Hi, could I get a medium iced latte, please?"
        accepted_variations:
          - "Hello, I'd like to order a..."
          - "Can I have a..., please?"
          - "I'll take a..."
        sort_order: 1
      - function_tag: "REQUEST"
        text: "Could you make it with oat milk?"
        meaning_vi: "Bạn có thể pha bằng sữa yến mạch được không?"
        example_sentence: "Could you make it with oat milk and less sugar, please?"
        accepted_variations:
          - "Can I get that with oat milk?"
          - "With oat milk instead, please."
        sort_order: 2
      - function_tag: "CLARIFY"
        text: "To go, please."
        meaning_vi: "Mang đi, cảm ơn."
        example_sentence: "Make that to go, please."
        accepted_variations:
          - "Takeaway, please."
          - "For takeaway, thank you."
          - "I'll have it to go."
        sort_order: 3
      - function_tag: "AGREE_DECLINE"
        text: "No, that will be all."
        meaning_vi: "Không, như vậy là đủ rồi."
        example_sentence: "No, that will be all for today, thank you."
        accepted_variations:
          - "That's everything, thanks."
          - "Nothing else for now."
        sort_order: 4
      - function_tag: "CLOSING"
        text: "Have a great day!"
        meaning_vi: "Chúc một ngày tốt lành!"
        example_sentence: "Thank you, have a great day!"
        accepted_variations:
          - "Thanks, you too!"
          - "Have a good one!"
        sort_order: 5
