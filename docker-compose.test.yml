name: talkwithme-test

services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talkwithme_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talkwithme_test"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - test-network

  redis-test:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 3s
    networks:
      - test-network

  backend-test-runner:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      APP_NAME: Talk-With-Me Test API
      APP_VERSION: 0.1.0-test
      ENVIRONMENT: test
      DEBUG: "True"
      POSTGRES_HOST: postgres-test
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: talkwithme_test
      REDIS_HOST: redis-test
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 1
      RUN_INTEGRATION_TESTS: "true"
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
